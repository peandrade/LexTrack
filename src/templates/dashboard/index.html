{% extends "base.html" %}

{% block title %}Dashboard - LexTrack{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
    <button onclick="checkAlerts()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">
        Verificar Alertas
    </button>
</div>

<div class="grid grid-cols-4 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6">
        <div class="text-sm text-gray-500 uppercase">Total de Contratos</div>
        <div id="stat-total" class="text-3xl font-bold text-gray-800 mt-2">-</div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <div class="text-sm text-gray-500 uppercase">Contratos Ativos</div>
        <div id="stat-active" class="text-3xl font-bold text-green-600 mt-2">-</div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <div class="text-sm text-gray-500 uppercase">Vencendo em 30 dias</div>
        <div id="stat-expiring" class="text-3xl font-bold text-yellow-600 mt-2">-</div>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <div class="text-sm text-gray-500 uppercase">Vencidos</div>
        <div id="stat-expired" class="text-3xl font-bold text-red-600 mt-2">-</div>
    </div>
</div>

<div class="grid grid-cols-2 gap-6">
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Distribuicao de Contratos</h2>
        <canvas id="statusChart" width="400" height="300"></canvas>
    </div>
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Proximos Vencimentos</h2>
        <div id="expiring-list" class="space-y-3">
            <p class="text-gray-500">Carregando...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadStats() {
    const response = await fetch('{{ url_for("dashboard.api_stats") }}');
    const data = await response.json();

    document.getElementById('stat-total').textContent = data.total;
    document.getElementById('stat-active').textContent = data.active;
    document.getElementById('stat-expiring').textContent = data.expiring_soon;
    document.getElementById('stat-expired').textContent = data.expired;

    const ctx = document.getElementById('statusChart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Ativos', 'Vencendo', 'Vencidos'],
            datasets: [{
                data: [data.active - data.expiring_soon, data.expiring_soon, data.expired],
                backgroundColor: ['#10B981', '#F59E0B', '#EF4444'],
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
}

async function loadExpiring() {
    const response = await fetch('{{ url_for("dashboard.api_expiring") }}');
    const data = await response.json();

    const container = document.getElementById('expiring-list');

    if (data.length === 0) {
        container.innerHTML = '<p class="text-gray-500">Nenhum contrato proximo do vencimento.</p>';
        return;
    }

    container.innerHTML = data.map(contract => {
        let colorClass = 'text-gray-600';
        if (contract.days_until_expiration <= 7) {
            colorClass = 'text-red-600';
        } else if (contract.days_until_expiration <= 30) {
            colorClass = 'text-yellow-600';
        }

        return `
            <a href="/contracts/${contract.id}" class="block p-3 bg-gray-50 rounded-lg hover:bg-gray-100">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-medium text-gray-800">${contract.title}</div>
                        <div class="text-sm text-gray-500">${contract.contract_type}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm ${colorClass} font-medium">${contract.days_until_expiration} dias</div>
                        <div class="text-xs text-gray-400">${new Date(contract.end_date).toLocaleDateString('pt-BR')}</div>
                    </div>
                </div>
            </a>
        `;
    }).join('');
}

async function checkAlerts() {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
        const response = await fetch('{{ url_for("dashboard.check_alerts") }}', { method: 'POST' });
        const data = await response.json();

        let message = `Verificados: ${data.checked} contratos\n`;
        if (data.alerts_sent.length > 0) {
            message += `Alertas enviados: ${data.alerts_sent.length}`;
        } else {
            message += 'Nenhum alerta para enviar hoje.';
        }
        alert(message);
    } catch (error) {
        alert('Erro ao verificar alertas: ' + error.message);
    }

    btn.disabled = false;
    btn.textContent = 'Verificar Alertas';
}

loadStats();
loadExpiring();
</script>
{% endblock %}
